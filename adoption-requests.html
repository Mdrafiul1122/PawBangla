<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PawBangla — Adoption Requests</title>
<link rel="stylesheet" href="admin.css">
</head>
<body>

  <div class="admin-mobile-bar">
    <a class="brand-link" href="admin-dashboard.html"><span><i data-lucide="paw-print" style="width:16px;height:16px;vertical-align:-3px;"></i></span> PawBangla Admin</a>
    <div class="m-links">
      <a href="admin-dashboard.html" data-page="admin-dashboard.html">Dash</a>
      <a href="manage-pets.html" data-page="manage-pets.html">Pets</a>
      <a href="adoption-requests.html" data-page="adoption-requests.html">Requests</a>
      <a href="manage-users.html" data-page="manage-users.html">Users</a>
    </div>
  </div>

  <!-- Sidebar -->
  <aside class="admin-sidebar">
    <div>
      <a class="admin-brand" href="admin-dashboard.html">
        <div class="icon"><i data-lucide="paw-print" style="width:18px;height:18px;"></i></div>
        <div class="text">
          <div class="name">Paw<span>Bangla</span></div>
          <div class="sub">Admin Panel</div>
        </div>
      </a>

      <nav class="admin-nav">
        <div class="nav-label">Overview</div>
        <a href="admin-dashboard.html" data-page="admin-dashboard.html"><span><i data-lucide="home" style="width:16px;height:16px;vertical-align:-3px;"></i> Dashboard</span></a>
        <div class="nav-label">Manage</div>
        <a href="manage-pets.html" data-page="manage-pets.html"><span><i data-lucide="paw-print" style="width:16px;height:16px;vertical-align:-3px;"></i> Pets</span><span class="badge" id="navPetBadge">0</span></a>
        <a href="adoption-requests.html" data-page="adoption-requests.html"><span><i data-lucide="file-text" style="width:16px;height:16px;vertical-align:-3px;"></i> Adoption Requests</span><span class="badge" id="navReqBadge">0</span></a>
        <a href="manage-users.html" data-page="manage-users.html"><span><i data-lucide="user" style="width:16px;height:16px;vertical-align:-3px;"></i> Users</span><span class="badge" id="navUserBadge">0</span></a>
        <div class="nav-label">Links</div>
        <a href="index.html"><span><i data-lucide="globe" style="width:16px;height:16px;vertical-align:-3px;"></i> View Site</span></a>
        <a href="Browse.html"><span><i data-lucide="shopping-cart" style="width:16px;height:16px;vertical-align:-3px;"></i> Adopter Portal</span></a>
      </nav>
    </div>

    <div class="admin-sidebar-footer">
      <div class="admin-user-row">
        <div class="admin-avatar"><i data-lucide="user" style="width:16px;height:16px;"></i></div>
        <div>
          <div class="name js-admin-name">Site Admin</div>
          <div class="role">Administrator</div>
        </div>
      </div>
      <a href="admin-login.html" class="logout-btn-admin"><i data-lucide="log-out" style="width:14px;height:14px;"></i> Logout</a>
    </div>
  </aside>

  <!-- Main -->
  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Adoption Requests</h1>
      <div class="admin-actions">
        <a class="btn btn-outline" href="index.html"><i data-lucide="globe" style="width:14px;height:14px;vertical-align:-2px;margin-right:4px;"></i> View Site</a>
      </div>
    </div>

    <div class="admin-card">
      <div class="status-tabs" id="reqTabs">
        <button class="tab active" data-status="All">All</button>
        <button class="tab" data-status="Pending">Pending</button>
        <button class="tab" data-status="Under Review">Under Review</button>
        <button class="tab" data-status="Approved">Approved</button>
        <button class="tab" data-status="Rejected">Rejected</button>
        <button class="tab" data-status="Completed">Completed</button>
      </div>

      <div class="table-wrap">
        <table class="admin-table">
          <thead>
            <tr>
              <th>Applicant</th>
              <th>Pet</th>
              <th>Applied On</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="requestsBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Request details modal -->
  <div class="modal-overlay" id="requestModal">
    <div class="modal">
      <button class="modal-close" data-close="requestModal"><i data-lucide="x" style="width:16px;height:16px;"></i></button>
      <h3 id="reqModalTitle">Request Details</h3>
      <p class="modal-sub" id="reqModalStatus"></p>

      <div class="detail-grid" id="reqDetails"></div>

      <div class="modal-actions" id="reqModalActions"></div>
    </div>
  </div>

  <!-- Confirm modal -->
  <div class="modal-overlay" id="confirmModal">
    <div class="modal modal-sm">
      <div class="confirm-icon"><i data-lucide="triangle-alert" style="width:30px;height:30px;" aria-hidden="true"></i></div>
      <h3 style="text-align:center;">Are you sure?</h3>
      <p id="confirmText" style="text-align:center;font-size:13px;color:var(--text-mid);margin-top:8px;"></p>
      <div class="modal-actions" style="justify-content:center;">
        <button class="btn btn-outline" id="confirmCancel">Cancel</button>
        <button class="btn btn-danger" id="confirmOk">Confirm</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/lucide.min.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/pet-data.js"></script>
  <script src="js/admin.js"></script>
  <script src="js/adoption-requests.js"></script>
</body>
</html>
