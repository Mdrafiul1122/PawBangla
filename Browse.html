<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PawBangla — Browse Pets</title>
<link rel="stylesheet" href="Styles.css">
</head>
<body>

  <!-- Mobile top bar -->
  <div class="mobile-bar">
    <a class="logo-link" href="index.html"><i data-lucide="paw-print" style="width:18px;height:18px;vertical-align:-3px;"></i> Paw<span>Bangla</span></a>
    <div class="mobile-links">
      <a href="user-dashboard.html">Dashboard</a>
      <a href="Browse.html">Browse</a>
      <a href="Apply.html">Adopt</a>
    </div>
  </div>

  <!-- Sidebar -->
  <aside class="sidebar">
    <div>
      <div class="brand">
        <a class="brand-link" href="index.html">
          <div class="brand-icon"><i data-lucide="paw-print" style="width:18px;height:18px;"></i></div>
          <div class="brand-text">
            <div class="name">Paw<span>Bangla</span></div>
            <div class="subtitle">Adopter Portal</div>
          </div>
        </a>
      </div>

      <nav class="main-nav">
        <a class="nav-item" href="user-dashboard.html"><span class="left"><i data-lucide="layout-dashboard" style="width:16px;height:16px;"></i> Dashboard</span></a>
        <a class="nav-item active" href="Browse.html"><span class="left"><i data-lucide="paw-print" style="width:16px;height:16px;"></i> Browse Pets</span></a>
        <a class="nav-item" href="user-dashboard.html"><span class="left"><i data-lucide="file-text" style="width:16px;height:16px;"></i> My Applications</span><span class="badge" id="appBadge">0</span></a>
        <a class="nav-item" href="user-dashboard.html"><span class="left"><i data-lucide="heart" style="width:16px;height:16px;"></i> Favorites</span><span class="badge" id="favBadge">0</span></a>
        <a class="nav-item" href="user-dashboard.html"><span class="left"><i data-lucide="user" style="width:16px;height:16px;"></i> Profile</span></a>
        <a class="nav-item" href="user-dashboard.html"><span class="left"><i data-lucide="bell" style="width:16px;height:16px;"></i> Notifications</span><span class="badge">2</span></a>
      </nav>
    </div>

    <div class="sidebar-footer">
      <div class="user-row">
        <div class="user-avatar"><i data-lucide="user" style="width:16px;height:16px;"></i></div>
        <div>
          <div class="user-name js-username">Rahim Uddin</div>
          <div class="user-role">User</div>
        </div>
      </div>
      <a href="login.html" class="logout-btn" onclick="logout(); return false;"><i data-lucide="log-out" style="width:14px;height:14px;"></i> Logout</a>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main">
    <div class="top-bar">
      <h1>Browse Pets</h1>
      <div class="top-actions">
        <a href="user-dashboard.html" class="icon-btn"><i data-lucide="bell" style="width:16px;height:16px;"></i><span class="dot">2</span></a>
        <button class="primary-btn" id="findPetBtn">Find a Pet</button>
      </div>
    </div>

    <div class="filters" id="filters">
      <input type="text" id="searchInput" placeholder="Search by name, breed, or location...">
      <select id="typeFilter">
        <option value="">All Types</option>
        <option value="Dog">Dog</option>
        <option value="Cat">Cat</option>
        <option value="Bird">Bird</option>
        <option value="Rabbit">Rabbit</option>
      </select>
      <select id="locFilter">
        <option value="">All Locations</option>
        <option value="Dhaka">Dhaka</option>
        <option value="Chittagong">Chittagong</option>
        <option value="Sylhet">Sylhet</option>
        <option value="Rajshahi">Rajshahi</option>
        <option value="Khulna">Khulna</option>
      </select>
      <select id="compatFilter">
        <option value="0">Any Compatibility</option>
        <option value="90">90%+</option>
        <option value="80">80%+</option>
        <option value="70">70%+</option>
      </select>
    </div>

    <div class="results-count" id="resultsCount">6 pets available for adoption</div>

    <div class="pet-grid" id="petGrid">
    </div>
  </main>

  <script src="js/lucide.min.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/pet-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/browse.js"></script>
</body>
</html>
