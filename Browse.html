<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PawBangla — Browse Pets</title>
<link rel="stylesheet" href="Styles.css">
<link rel="stylesheet" href="shared-nav.css">
</head>
<body>

  <!-- Mobile top bar -->
  <div class="mobile-bar">
    <a class="logo-link" href="index.html">✦ Paw<span>Bangla</span></a>
    <div class="mobile-links">
      <a href="user-dashboard.html">Dashboard</a>
      <a href="Browse.html">Browse</a>
      <a href="Apply.html">Adopt</a>
    </div>
  </div>

  <!-- Sidebar -->
<aside class="sidebar">
    <div>
      <nav class="main-nav">
        <a class="nav-item" href="user-dashboard.html"><span class="left">Dashboard</span></a>
        <a class="nav-item active" href="Browse.html"><span class="left"> Browse Pets</span></a>
        <a class="nav-item" href="petstorypost.html"><span class="left"> Success Stories</span></a>
        <a class="nav-item" href="user-dashboard.html"><span class="left"> My Applications</span><span class="badge" id="appBadge">0</span></a>
        <a class="nav-item" href="user-dashboard.html"><span class="left">Favorites</span><span class="badge" id="favBadge">0</span></a>
        <a class="nav-item" href="user-dashboard.html"><span class="left"> Profile</span></a>
        <a class="nav-item" href="user-dashboard.html"><span class="left"> Notifications</span><span class="badge">2</span></a>
      </nav>
    </div>

    <div class="sidebar-footer">
      <div class="user-row">
        <div class="user-avatar">👤</div>
        <div>
          <div class="user-name js-username">Rahim Uddin</div>
          <div class="user-role">User</div>
        </div>
      </div>
      <a href="login.html" class="logout-btn" onclick="logout(); return false;">Logout</a>
    </div>
  </aside>

  <!-- Main content -->
  <main class="main">
    <div class="top-bar">
      <h1>Browse Pets</h1>
      <div class="top-actions">
        <button class="primary-btn" id="findPetBtn">Find a Pet</button>
      </div>
    </div>

    <div class="filters" id="filters">
      <input type="text" id="searchInput" placeholder="Search by name, breed, or location...">
      <select id="typeFilter">
        <option value="">All Types</option>
        <option value="Dog">Dog</option>
        <option value="Cat">Cat</option>
        <option value="Bird">Bird</option>
        <option value="Rabbit">Rabbit</option>
      </select>
      <select id="locFilter">
        <option value="">All Locations</option>
        <option value="Dhaka">Dhaka</option>
        <option value="Chittagong">Chittagong</option>
        <option value="Sylhet">Sylhet</option>
        <option value="Rajshahi">Rajshahi</option>
        <option value="Khulna">Khulna</option>
      </select>
    </div>

    <div class="results-count" id="resultsCount">6 pets available for adoption</div>

    <div class="pet-grid" id="petGrid">
    </div>
  </main>

  <script src="js/pet-data.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/browse.js"></script>
  <script src="shared-nav.js"></script>
</body>
</html>
